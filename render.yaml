services:
  - type: web
    name: smart-emobility-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: yarn install --production=false && yarn db:generate && yarn build
    startCommand: yarn start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: JWT_EXPIRES_IN_SECONDS
        value: "86400"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
